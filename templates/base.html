<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PDF압축 - 무료 PDF 용량 줄이기{% endblock %}</title>
<meta name="description" content="{% block description %}브라우저에서 바로 PDF 파일 용량을 무료로 줄여보세요. 회원가입 없이, 설치 없이 몇 초 만에 PDF를 압축합니다.{% endblock %}">
<link rel="canonical" href="{{ request.base_url }}">
<meta property="og:title" content="{% block og_title %}PDF압축 - 무료 PDF 용량 줄이기{% endblock %}">
<meta property="og:description" content="{% block og_description %}회원가입 없이 무료로 PDF 용량을 줄여보세요.{% endblock %}">
<meta property="og:type" content="website">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<!-- Google AdSense: 계정 승인 후 아래 client 값을 교체하세요 -->
<!-- <script async src="https://pages.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ url_for('index') }}">PDF<span>압축</span></a>
    <nav class="nav">
      <a href="{{ url_for('index') }}">홈</a>
      <a href="{{ url_for('about') }}">소개</a>
      <a href="{{ url_for('privacy') }}">개인정보처리방침</a>
      <a href="{{ url_for('terms') }}">이용약관</a>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ 2026 }} PDF압축. 모든 파일은 처리 후 자동 삭제됩니다.</p>
    <div class="footer-links">
      <a href="{{ url_for('about') }}">소개</a>
      <a href="{{ url_for('privacy') }}">개인정보처리방침</a>
      <a href="{{ url_for('terms') }}">이용약관</a>
    </div>
  </div>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
